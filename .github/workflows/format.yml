name: Cargo format

on:
   workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format (desktop / server)
  # ---------------------------------------------------------------------------
  lint-and-format:
    name: Lint & format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: format
        run: cargo fmt --all --

      - name: Run clippy
        run: cargo clippy --target aarch64-linux-android --no-default-features --features "mpd,drm,xtream,extractors,telegram,acestream,web-ui,base64-url,tls-rustls" -- -D warnings

      - name: Run tests
        # --test-threads=1 because a few config tests mutate global env vars and
        # race each other in parallel runs.
        # Extractor tests are excluded here — they hit real upstream hosts
        # (Cloudflare / Turnstile-protected) and are run locally only.
        run: |
          cargo test --release --lib --bins -- --test-threads=1
          cargo test --release --test auth_tests --test config_tests -- --test-threads=1

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Audit unused dependencies
        run: cargo machete
