name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  CARGO_TERM_COLOR: always
  # The version you use for actual releases
  RELEASE_RUST_VERSION: 1.95.0

  LINUX_FEATURES: "extractors,transcode,web-ui"

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: Formatting, Linting, and Testing
  # ---------------------------------------------------------------------------
  check-and-test:
    name: Check & Test (${{ matrix.rust }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Test against both the pinned release version and the latest stable
        rust: ["1.95.0", "stable"]
        
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache dependencies and build artifacts
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Lint)
        # We use --all-features to ensure feature-gated code is also linted
        run: cargo clippy --all-targets --features "${{ env.LINUX_FEATURES }}" -- -D warnings

      - name: Run tests
        # We use --all-features to ensure tests for hls, mpd, xtream, etc. run
        run: cargo test --features "${{ env.LINUX_FEATURES }}"
